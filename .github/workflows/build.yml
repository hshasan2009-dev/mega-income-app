name: Build Mega Income App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: অ্যাপের ফাইল তৈরি
        run: |
          cat > settings.gradle <<'MIEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MegaIncome"
          include ':app'
          MIEOF
          cat > build.gradle <<'MIEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          MIEOF
          cat > gradle.properties <<'MIEOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          MIEOF
          mkdir -p app
          cat > app/google-services.json <<'MIEOF'
          {
            "project_info": {
              "project_number": "966606423528",
              "firebase_url": "https://mega-income-bot-9d9fa-default-rtdb.firebaseio.com",
              "project_id": "mega-income-bot-9d9fa",
              "storage_bucket": "mega-income-bot-9d9fa.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:966606423528:android:5c3c111b4c363d30a4d05d",
                  "android_client_info": {
                    "package_name": "com.megaincome.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCtWFj_yVuwK_wQPEoH8YyaY40js4w9RdQ"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          MIEOF
          cat > app/build.gradle <<'MIEOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          def vcode = (project.findProperty('vc') ?: '1').toString().toInteger()
          def vname = (project.findProperty('vn') ?: '1.0').toString()

          android {
              namespace 'com.megaincome.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.megaincome.app'
                  minSdk 23
                  targetSdk 34
                  versionCode vcode
                  versionName vname
              }

              signingConfigs {
                  release {
                      storeFile file('megaincome.p12')
                      storeType 'pkcs12'
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'megaincome'
                      keyPassword System.getenv('KS_PASS')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.1.2')
              implementation 'com.google.firebase:firebase-messaging'
              implementation 'androidx.core:core:1.13.1'
          }
          MIEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'MIEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Mega Income"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MegaFcmService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          MIEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/app.xml <<'MIEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#0B1220</color>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/splash_bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
              </style>
          </resources>
          MIEOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_notify.xml <<'MIEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.89,2 2,2zM18,16v-5c0,-3.07 -1.64,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.63,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z" />
          </vector>
          MIEOF
          cat > app/src/main/res/drawable/ic_download.xml <<'MIEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#1A1204"
                  android:pathData="M19,9h-4V3H9v6H5l7,7 7,-7zM5,18v2h14v-2H5z" />
          </vector>
          MIEOF
          cat > app/src/main/res/drawable/splash_bg.xml <<'MIEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/bg" />
              <item
                  android:width="96dp"
                  android:height="96dp"
                  android:gravity="center">
                  <bitmap
                      android:gravity="fill"
                      android:src="@mipmap/ic_launcher" />
              </item>
          </layer-list>
          MIEOF
          mkdir -p app/src/main/res/values-v31
          cat > app/src/main/res/values-v31/app.xml <<'MIEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/splash_bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
                  <item name="android:windowSplashScreenBackground">@color/bg</item>
              </style>
          </resources>
          MIEOF
          mkdir -p app/src/main/java/com/megaincome/app
          cat > app/src/main/java/com/megaincome/app/MainActivity.java <<'MIEOF'
          package com.megaincome.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.net.ConnectivityManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.webkit.JavascriptInterface;
          import com.google.firebase.messaging.FirebaseMessaging;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {

              static final String HOST = "mega-income-pro1.vercel.app";
              static final String SITE = "https://" + HOST + "/";
              static final int FILE_REQ = 1001;

              WebView web;
              ValueCallback<Uri[]> fileCb;
              long lastBack = 0;
              android.widget.FrameLayout frame;
              android.view.View splash;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF0B1220);
                  frame = new android.widget.FrameLayout(this);
                  frame.setBackgroundColor(0xFF0B1220);
                  frame.addView(web, new android.widget.FrameLayout.LayoutParams(-1, -1));
                  buildSplash();
                  setContentView(frame);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setUserAgentString(s.getUserAgentString() + " MegaIncomeApp");
                  web.addJavascriptInterface(new Bridge(), "MegaApp");
                  CookieManager.getInstance().setAcceptCookie(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          if (!r.isForMainFrame()) return false;
                          Uri u = r.getUrl();
                          if ("megaincome".equals(u.getScheme())) { retry(); return true; }
                          String sc = u.getScheme();
                          if (("http".equals(sc) || "https".equals(sc)) && HOST.equals(u.getHost())) return false;
                          openExternal(u);
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) showOffline();
                      }

                      @Override
                      public void onPageFinished(WebView v, String u) {
                          if (u != null && u.startsWith("https://" + HOST)) hideSplash();
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try {
                              startActivityForResult(p.createIntent(), FILE_REQ);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.setDownloadListener((url, ua, cd, mime, len) -> openExternal(Uri.parse(url)));

                  if (online()) web.loadUrl(SITE); else showOffline();
                  checkUpdate();
                  setupPush();
              }

              void setupPush() {
                  try {
                      if (Build.VERSION.SDK_INT >= 33
                              && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 77);
                      }
                  } catch (Exception e) {
                      // অনুমতি চাওয়া ব্যর্থ হলে চুপচাপ বাদ
                  }
                  try {
                      FirebaseMessaging fm = FirebaseMessaging.getInstance();
                      fm.subscribeToTopic("all");
                      fm.getToken().addOnCompleteListener(t -> {
                          if (t.isSuccessful() && t.getResult() != null) {
                              MegaFcmService.saveToken(MainActivity.this, t.getResult());
                          }
                      });
                  } catch (Exception e) {
                      // নোটিফিকেশন চালু না হলেও অ্যাপ চলবে
                  }
              }

              class Bridge {
                  @JavascriptInterface
                  public String getToken() {
                      return MegaFcmService.token(MainActivity.this);
                  }
              }

              void openExternal(Uri u) {
                  try {
                      Intent i;
                      if ("intent".equals(u.getScheme())) {
                          i = Intent.parseUri(u.toString(), Intent.URI_INTENT_SCHEME);
                      } else {
                          i = new Intent(Intent.ACTION_VIEW, u);
                      }
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "এই লিংক খোলা যায়নি", Toast.LENGTH_SHORT).show();
                  }
              }

              void buildSplash() {
                  final float d = getResources().getDisplayMetrics().density;
                  android.widget.LinearLayout sp = new android.widget.LinearLayout(this);
                  sp.setOrientation(android.widget.LinearLayout.VERTICAL);
                  sp.setGravity(android.view.Gravity.CENTER);
                  sp.setBackgroundColor(0xFF0B1220);
                  android.widget.ImageView lg = new android.widget.ImageView(this);
                  lg.setImageResource(R.mipmap.ic_launcher);
                  lg.setOutlineProvider(new android.view.ViewOutlineProvider() {
                      @Override
                      public void getOutline(android.view.View v, android.graphics.Outline o) {
                          o.setRoundRect(0, 0, v.getWidth(), v.getHeight(), 22 * d);
                      }
                  });
                  lg.setClipToOutline(true);
                  sp.addView(lg, new android.widget.LinearLayout.LayoutParams((int) (96 * d), (int) (96 * d)));
                  android.widget.TextView nm = label("Mega Income", 24, 0xFFE8C872, true);
                  android.widget.LinearLayout.LayoutParams np = new android.widget.LinearLayout.LayoutParams(
                          android.widget.LinearLayout.LayoutParams.WRAP_CONTENT, android.widget.LinearLayout.LayoutParams.WRAP_CONTENT);
                  np.topMargin = (int) (18 * d);
                  sp.addView(nm, np);
                  frame.addView(sp, new android.widget.FrameLayout.LayoutParams(-1, -1));
                  splash = sp;
                  new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> hideSplash(), 10000);
              }

              void hideSplash() {
                  if (splash == null) return;
                  final android.view.View sp = splash;
                  splash = null;
                  sp.animate().alpha(0f).setDuration(300).withEndAction(() -> {
                      if (sp.getParent() instanceof android.view.ViewGroup) ((android.view.ViewGroup) sp.getParent()).removeView(sp);
                  }).start();
              }

              boolean online() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      android.net.Network n = cm.getActiveNetwork();
                      if (n == null) return false;
                      android.net.NetworkCapabilities nc = cm.getNetworkCapabilities(n);
                      return nc != null && nc.hasCapability(android.net.NetworkCapabilities.NET_CAPABILITY_INTERNET);
                  } catch (Exception e) {
                      return true;
                  }
              }

              void retry() {
                  if (online()) {
                      web.loadUrl(SITE);
                  } else {
                      Toast.makeText(this, "ইন্টারনেট চালু করে আবার চেষ্টা করুন", Toast.LENGTH_SHORT).show();
                  }
              }

              void showOffline() {
                  hideSplash();
                  String html = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head>"
                          + "<body style='margin:0;background:#0b1220;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center'>"
                          + "<div style='padding:24px'><div style='font-size:46px'>&#128225;</div><h3>ইন্টারনেট সংযোগ নেই</h3>"
                          + "<p style='color:#b9c0d0'>সংযোগ চেক করে আবার চেষ্টা করুন</p>"
                          + "<a href='megaincome://retry' style='display:inline-block;text-decoration:none;color:#000;background:#e8c872;border-radius:12px;padding:12px 26px;font-size:16px;font-weight:700'>আবার চেষ্টা করুন</a>"
                          + "</div></body></html>";
                  web.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
              }

              void checkUpdate() {
                  new Thread(() -> {
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(SITE + "app-version.json?t=" + System.currentTimeMillis()).openConnection();
                          c.setConnectTimeout(8000);
                          c.setReadTimeout(8000);
                          if (c.getResponseCode() != 200) return;
                          BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                          StringBuilder sb = new StringBuilder();
                          String ln;
                          while ((ln = r.readLine()) != null) sb.append(ln);
                          r.close();
                          JSONObject j = new JSONObject(sb.toString());
                          final int latest = j.optInt("versionCode", 0);
                          final String url = j.optString("apkUrl", "");
                          final String msg = j.optString("message", "অ্যাপের নতুন ভার্সন এসেছে।");
                          final boolean force = j.optBoolean("force", false);
                          final String vn = j.optString("versionName", "");
                          int cur = getPackageManager().getPackageInfo(getPackageName(), 0).versionCode;
                          if (latest > cur && url.length() > 0) {
                              runOnUiThread(() -> showUpdate(url, msg, force, cur, vn.length() > 0 ? vn : "v" + latest));
                          }
                      } catch (Exception e) {
                          // আপডেট চেক ব্যর্থ হলে চুপচাপ বাদ
                      }
                  }).start();
              }

              android.widget.TextView label(String t, float sp, int color, boolean bold) {
                  android.widget.TextView x = new android.widget.TextView(this);
                  x.setText(t);
                  x.setTextSize(sp);
                  x.setTextColor(color);
                  x.setGravity(android.view.Gravity.CENTER);
                  if (bold) x.setTypeface(null, android.graphics.Typeface.BOLD);
                  return x;
              }

              void showUpdate(final String url, String msg, final boolean force, int cur, String newVer) {
                  if (isFinishing()) return;
                  final float d = getResources().getDisplayMetrics().density;
                  final android.app.Dialog dlg = new android.app.Dialog(this);
                  dlg.requestWindowFeature(android.view.Window.FEATURE_NO_TITLE);
                  dlg.setCancelable(!force);
                  dlg.setCanceledOnTouchOutside(!force);

                  android.widget.LinearLayout root = new android.widget.LinearLayout(this);
                  root.setOrientation(android.widget.LinearLayout.VERTICAL);
                  root.setGravity(android.view.Gravity.CENTER_HORIZONTAL);
                  root.setPadding((int) (24 * d), (int) (32 * d), (int) (24 * d), (int) (20 * d));
                  android.graphics.drawable.GradientDrawable bg = new android.graphics.drawable.GradientDrawable();
                  bg.setColor(0xFF101A2E);
                  bg.setCornerRadius(26 * d);
                  bg.setStroke((int) (1.5f * d), 0xFFE8C872);
                  root.setBackground(bg);

                  android.widget.ImageView logo = new android.widget.ImageView(this);
                  logo.setImageResource(R.mipmap.ic_launcher);
                  logo.setScaleType(android.widget.ImageView.ScaleType.FIT_CENTER);
                  logo.setOutlineProvider(new android.view.ViewOutlineProvider() {
                      @Override
                      public void getOutline(android.view.View v, android.graphics.Outline o) {
                          o.setRoundRect(0, 0, v.getWidth(), v.getHeight(), 22 * d);
                      }
                  });
                  logo.setClipToOutline(true);
                  android.widget.LinearLayout.LayoutParams lp = new android.widget.LinearLayout.LayoutParams((int) (92 * d), (int) (92 * d));
                  lp.bottomMargin = (int) (18 * d);
                  root.addView(logo, lp);

                  root.addView(label("নতুন আপডেট এসেছে", 22, 0xFFFFFFFF, true));

                  android.widget.TextView chip = label("নতুন ভার্সন " + newVer, 13, 0xFF1A1204, true);
                  android.graphics.drawable.GradientDrawable cbg = new android.graphics.drawable.GradientDrawable();
                  cbg.setColor(0xFFE8C872);
                  cbg.setCornerRadius(30 * d);
                  chip.setBackground(cbg);
                  chip.setPadding((int) (14 * d), (int) (5 * d), (int) (14 * d), (int) (5 * d));
                  android.widget.LinearLayout.LayoutParams cp = new android.widget.LinearLayout.LayoutParams(
                          android.widget.LinearLayout.LayoutParams.WRAP_CONTENT, android.widget.LinearLayout.LayoutParams.WRAP_CONTENT);
                  cp.topMargin = (int) (12 * d);
                  root.addView(chip, cp);

                  android.widget.TextView body = label(msg, 16, 0xFFC9D1E3, false);
                  body.setLineSpacing(0, 1.25f);
                  android.widget.LinearLayout.LayoutParams bp = new android.widget.LinearLayout.LayoutParams(
                          android.widget.LinearLayout.LayoutParams.MATCH_PARENT, android.widget.LinearLayout.LayoutParams.WRAP_CONTENT);
                  bp.topMargin = (int) (20 * d);
                  bp.bottomMargin = (int) (26 * d);
                  root.addView(body, bp);

                  android.widget.LinearLayout btn = new android.widget.LinearLayout(this);
                  btn.setOrientation(android.widget.LinearLayout.HORIZONTAL);
                  btn.setGravity(android.view.Gravity.CENTER);
                  btn.setPadding(0, (int) (14 * d), 0, (int) (14 * d));
                  android.graphics.drawable.GradientDrawable bbg = new android.graphics.drawable.GradientDrawable();
                  bbg.setColor(0xFFE8C872);
                  bbg.setCornerRadius(14 * d);
                  btn.setBackground(bbg);
                  android.widget.ImageView ic = new android.widget.ImageView(this);
                  ic.setImageResource(R.drawable.ic_download);
                  android.widget.LinearLayout.LayoutParams ip = new android.widget.LinearLayout.LayoutParams((int) (20 * d), (int) (20 * d));
                  ip.rightMargin = (int) (8 * d);
                  btn.addView(ic, ip);
                  btn.addView(label("আপডেট করুন", 16, 0xFF1A1204, true));
                  btn.setOnClickListener(v -> {
                      openExternal(Uri.parse(url));
                      if (force) finish(); else dlg.dismiss();
                  });
                  root.addView(btn, new android.widget.LinearLayout.LayoutParams(
                          android.widget.LinearLayout.LayoutParams.MATCH_PARENT, android.widget.LinearLayout.LayoutParams.WRAP_CONTENT));

                  if (!force) {
                      android.widget.TextView later = label("পরে", 14, 0xFF8B94A8, false);
                      later.setPadding((int) (24 * d), (int) (14 * d), (int) (24 * d), (int) (6 * d));
                      later.setOnClickListener(v -> dlg.dismiss());
                      root.addView(later);
                  }

                  dlg.setContentView(root);
                  android.view.Window w = dlg.getWindow();
                  if (w != null) {
                      w.setBackgroundDrawable(new android.graphics.drawable.ColorDrawable(android.graphics.Color.TRANSPARENT));
                      w.setDimAmount(0.75f);
                  }
                  dlg.show();
                  if (w != null) {
                      w.setLayout((int) (getResources().getDisplayMetrics().widthPixels * 0.9f), android.view.ViewGroup.LayoutParams.WRAP_CONTENT);
                  }
              }

              @Override
              protected void onActivityResult(int rq, int rs, Intent data) {
                  if (rq == FILE_REQ && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs, data));
                      fileCb = null;
                  } else {
                      super.onActivityResult(rq, rs, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else if (System.currentTimeMillis() - lastBack < 2000) {
                      super.onBackPressed();
                  } else {
                      lastBack = System.currentTimeMillis();
                      Toast.makeText(this, "বের হতে আবার চাপুন", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onPause() {
                  web.onPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          MIEOF
          cat > app/src/main/java/com/megaincome/app/MegaFcmService.java <<'MIEOF'
          package com.megaincome.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;

          import com.google.firebase.messaging.FirebaseMessaging;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          import java.util.Map;

          public class MegaFcmService extends FirebaseMessagingService {

              static final String CHANNEL = "mega_updates";

              static void saveToken(Context c, String t) {
                  c.getSharedPreferences("mega_fcm", Context.MODE_PRIVATE).edit().putString("token", t).apply();
              }

              static String token(Context c) {
                  return c.getSharedPreferences("mega_fcm", Context.MODE_PRIVATE).getString("token", "");
              }

              @Override
              public void onNewToken(String t) {
                  saveToken(this, t);
                  try {
                      FirebaseMessaging.getInstance().subscribeToTopic("all");
                  } catch (Exception e) {
                      // বাদ
                  }
              }

              @Override
              public void onMessageReceived(RemoteMessage m) {
                  Map<String, String> d = m.getData();
                  String title = d.get("title");
                  String body = d.get("body");
                  if (title == null && m.getNotification() != null) {
                      title = m.getNotification().getTitle();
                      body = m.getNotification().getBody();
                  }
                  if (title == null) title = "Mega Income";
                  if (body == null) body = "";
                  show(title, body);
              }

              void show(String title, String body) {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationChannel ch = new NotificationChannel(CHANNEL, "Mega Income", NotificationManager.IMPORTANCE_HIGH);
                          nm.createNotificationChannel(ch);
                      }
                      Intent i = getPackageManager().getLaunchIntentForPackage(getPackageName());
                      PendingIntent pi = null;
                      if (i != null) {
                          pi = PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      }
                      NotificationCompat.Builder b = new NotificationCompat.Builder(this, CHANNEL)
                              .setSmallIcon(R.drawable.ic_notify)
                              .setContentTitle(title)
                              .setContentText(body)
                              .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                              .setAutoCancel(true)
                              .setPriority(NotificationCompat.PRIORITY_HIGH);
                      if (pi != null) b.setContentIntent(pi);
                      nm.notify((int) (System.currentTimeMillis() % 2000000000L), b.build());
                  } catch (Exception e) {
                      // নোটিফিকেশন দেখানো না গেলে বাদ
                  }
              }
          }
          MIEOF

      - name: আইকন বানানো (সাইটের লোগো থেকে)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          curl -fsSL https://mega-income-pro1.vercel.app/icon-512.png -o icon.png
          for s in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $s
            mkdir -p app/src/main/res/mipmap-$1
            convert icon.png -resize $2x$2 app/src/main/res/mipmap-$1/ic_launcher.png
          done

      - name: সাইনিং কি
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: echo "$KS_B64" | base64 -d > app/megaincome.p12

      - name: APK বিল্ড
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle --no-daemon assembleRelease -Pvc=${{ github.run_number }} -Pvn=1.0.${{ github.run_number }}

      - name: নাম ঠিক করা
        run: cp app/build/outputs/apk/release/app-release.apk Mega-Income.apk

      - name: ডাউনলোড লিংক (Release) তৈরি
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mega Income v${{ github.run_number }}
          files: Mega-Income.apk
          make_latest: true

      - name: সবাইকে আপডেট নোটিফিকেশন পাঠানো
        continue-on-error: true
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          curl -fsS -X POST https://mega-income-pro1.vercel.app/api/notify \
            -H 'Content-Type: application/json' \
            -d "{\"type\":\"update\",\"secret\":\"$NOTIFY_SECRET\",\"version\":\"1.0.${{ github.run_number }}\"}"
